version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.26"

linters:
  disable-all: true
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - goconst
    - gocyclo
    - gocritic
    - goprintffuncname
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  exclusions:
    rules:
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - goconst
        path: models/.*\.go
  settings:
    gocyclo:
      min-complexity: 15

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
