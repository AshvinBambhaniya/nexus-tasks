services:
  db:
    image: postgres:15
    container_name: nexus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_tasks}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=nexus_db
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: always

  mailpit:
    image: axllent/mailpit
    container_name: nexus_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

  ldap:
    image: osixia/openldap:1.4.0
    container_name: nexus_ldap
    command: ["--copy-service"]
    environment:
      LDAP_TLS_VERIFY_CLIENT: try
    volumes:
      - ./ldap/config-ldap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config-ldap.ldif
    ports:
      - "389:389"
      - "636:636"
    restart: always

  dex:
    image: dexidp/dex:v2.41.1
    container_name: nexus_dex
    volumes:
      - ./ldap/config-ldap.yaml:/etc/dex/config.docker.yaml
    ports:
      - "5556:5556"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    command: dex serve /etc/dex/config.docker.yaml
    depends_on:
      - ldap
    restart: always

  migration:
    build: ./backend
    container_name: nexus_migration
    restart: on-failure
    depends_on:
      - db
    env_file:
      - ./backend/.env.docker
    command: ["./nexus-tasks", "migrate", "up"]

  backend:
    build: ./backend
    container_name: nexus_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
      - migration
      - redis
      - mailpit
    command: ["./nexus-tasks", "api"]

  worker:
    build: ./backend
    container_name: nexus_worker
    restart: always
    depends_on:
      - db
      - migration
      - redis
    env_file:
      - ./backend/.env.docker
    command: ["./nexus-tasks", "worker"]

  dlq_worker:
    build: ./backend
    container_name: nexus_dlq_worker
    restart: always
    profiles: [dlq]
    depends_on:
      - db
      - migration
      - redis
    env_file:
      - ./backend/.env.docker
    command: ["./nexus-tasks", "dead-letter-queue"]

  mcp_server:
    build: ./backend
    container_name: nexus_mcp_server
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
      - migration
      - redis
    command: ["./nexus-tasks", "mcp"]

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NUXT_PUBLIC_API_URL=http://localhost:8000
      - NUXT_API_URL=http://backend:8000
    ports:
      - "3000:80"

volumes:
  nexus_pgdata:
