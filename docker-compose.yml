services:
  db:
    image: postgres:15
    container_name: nexus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_tasks}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=nexus_db
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: always

  mailpit:
    image: axllent/mailpit
    container_name: nexus_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

  migration:
    build: ./golang-backend
    container_name: nexus_migration
    restart: on-failure
    depends_on:
      - db
    env_file:
      - ./golang-backend/.env.docker
    command: ["./nexus-tasks", "migrate", "up"]

  backend:
    build: ./golang-backend
    container_name: nexus_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./golang-backend/.env.docker
    depends_on:
      - db
      - migration
      - redis
      - mailpit
    command: ["./nexus-tasks", "api"]

  worker:
    build: ./golang-backend
    container_name: nexus_worker
    restart: always
    depends_on:
      - db
      - migration
      - redis
    env_file:
      - ./golang-backend/.env.docker
    command: ["./nexus-tasks", "worker"]

  dlq_worker:
    build: ./golang-backend
    container_name: nexus_dlq_worker
    restart: always
    profiles: [dlq]
    depends_on:
      - db
      - migration
      - redis
    env_file:
      - ./golang-backend/.env.docker
    command: ["./nexus-tasks", "dead-letter-queue"]

  frontend:
    build:
      context: ./nuxt-app
    restart: always
    depends_on:
      - backend
    environment:
      - NUXT_PUBLIC_API_URL=http://localhost:8000
      - NUXT_API_URL=http://backend:8000
    ports:
      - "3000:80"

volumes:
  nexus_pgdata:
