services:
  db:
    image: postgres:15
    container_name: nexus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_tasks}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=nexus_db
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    restart: always

  mailpit:
    image: axllent/mailpit
    container_name: nexus_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always

  ldap:
    image: osixia/openldap:1.4.0
    container_name: nexus_ldap_dev
    command: ["--copy-service"]
    environment:
      LDAP_TLS_VERIFY_CLIENT: try
    volumes:
      - ./ldap/config-ldap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config-ldap.ldif
    ports:
      - "389:389"
      - "636:636"
    restart: always

  dex:
    image: dexidp/dex:v2.41.1
    container_name: nexus_dex_dev
    volumes:
      - ./ldap/config-ldap.local.yaml:/etc/dex/config.docker.yaml
    ports:
      - "5556:5556"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    command: dex serve /etc/dex/config.docker.yaml
    depends_on:
      - ldap
    restart: always

volumes:
  nexus_pgdata:
