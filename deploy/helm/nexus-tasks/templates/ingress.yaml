{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexus-tasks.fullname" . }}
  labels:
    {{- include "nexus-tasks.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .serviceName "backend" }}{{ $.Release.Name }}-backend{{ else if eq .serviceName "frontend" }}{{ $.Release.Name }}-frontend{{ else }}{{ .serviceName }}{{ end }}
                port:
                  number: {{ if eq .serviceName "backend" }}{{ $.Values.backend.port }}{{ else if eq .serviceName "frontend" }}{{ $.Values.frontend.port }}{{ else }}80{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
